# Static hosting. The application is a single-page bundle with no server; a
# backend, when configured, is reached directly from the browser.
[build]
  command = "npm run build"
  publish = "dist"

# Every path serves the app; routing happens in the browser.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers the application needs and cannot set from inside the bundle.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
